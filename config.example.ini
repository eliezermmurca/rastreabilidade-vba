; =========================================================
; Configuração do Formulário de Consultas
; ---------------------------------------------------------
; Copie este arquivo para "config.ini" (mesma pasta do .xlsm)
; e preencha com os dados do seu ambiente.
; O arquivo config.ini NÃO deve ser versionado.
; =========================================================

[Aplicacao]
; Nome exibido nos títulos das mensagens
Nome=Formulário de Consultas
; Imagem do cabeçalho (caminho absoluto, UNC ou relativo ao .xlsm).
; Deixe vazio para não exibir imagem.
Logo=assets\logo.jpg

[BancoDeDados]
; Opção 1: informe a string de conexão completa (ignora os demais campos)
ConnectionString=
; Opção 2: informe os campos separadamente
Provider=SQLOLEDB
Servidor=SERVIDOR\INSTANCIA
Banco=NOME_DO_BANCO
; S = autenticação do Windows (dispensa usuário/senha)
AutenticacaoWindows=N
Usuario=usuario_leitura
Senha=
; Tempo limite de conexão (segundos)
Timeout=10

[Regras]
; Filial considerada nas consultas de vendas e cargas
CodFilial=100
; Tipo de movimento das entradas de matéria-prima
TipoMovEntrada=T200
; Documentos considerados pedido de venda (separados por vírgula)
DocsPedidoVenda=PVE,P00
; Tipos de movimento ignorados na tela de vendas (separados por vírgula)
TiposMovExcluidosVendas=T150,T196,T902,T901,T155,T905,T721,T226,T629,T630,T906,T536
